name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyinstaller
      - name: Run core tests
        run: python test/test_core.py
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name laolu-cleaner src/laolu_cleaner.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 老卢系统盘清理
          path: dist/laolu-cleaner.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/laolu-cleaner.exe
          body: 双击运行，免安装。杀毒软件首次扫描可能慢，属正常。
